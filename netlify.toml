# Netlify Configuration File

[build]
  base = "client"
  publish = "dist"
  command = "npm run build"

# Example proxy rules for your backend API and uploads (if hosted separately)
# IMPORTANT: These must be defined BEFORE the general /* redirect.
# If your backend is hosted separately (e.g., Render, Heroku, AWS), uncomment and configure:
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend-api-url.com/api/:splat"
#   status = 200
#   force = true
#
# [[redirects]]
#   from = "/uploads/*"
#   to = "https://your-backend-api-url.com/uploads/:splat"
#   status = 200
#   force = true

# Redirect rule for client-side routing (Single Page Application)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

