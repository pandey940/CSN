# Netlify Configuration File

[build]
  base = "client"
  publish = "dist"
  command = "npm run build"

# Redirect rule for client-side routing (Single Page Application)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Example proxy rule for your backend API
# If your backend is hosted separately (e.g., Render, Heroku, AWS), uncomment and configure:
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend-api-url.com/api/:splat"
#   status = 200
#   force = true
